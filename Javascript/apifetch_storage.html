<html lang="en">

<body>
    <h2>Product details</h2>
    <button id="loadBtn">Load Users</button>
    <p id="status"></p>
    <table border="2">
        <thead>
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Brand</th>
            </tr>
        </thead>
        <tbody id="userTable">
        </tbody>
    </table>
    <script>
        const loadBtn = document.getElementById("loadBtn");
        const userTable = document.getElementById("userTable");
        const status = document.getElementById("status");
        function displayUsers(users) {
            userTable.innerHtml = "";

            users.forEach((user => {
                const row = document.createElement("tr");
            }))
        }

        async function fetchUsers() {
            status.textContent = "Loading Users";
            loadBtn.disabled = true;
            userTable.innerHTML = "";

            try {
                const response = await fetch("https://dummyjson.com/products");

                if (!response.ok) {
                    throw new Error("Failed to fetch the data");
                }
                const data = await response.json();
                data.products.forEach((product) => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${product.title}</td>
                        <td>${product.category}</td>
                        <td>${product.price}</td>
                        <td>${product.brand}</td>
                        `;
                    userTable.appendChild(row);
                });
                const users = await response.JSON();

                localStorage.setItem("users", JSON.stringify(users)); //Store API data in local storage
                displayUsers(users); //display the fetched data
                status.textContent = "Products loaded successfully!";
            } catch (error) {
                status.textContent = "Error:" + error.message;
            } finally {
                loadBtn.disabled = false;
            }
        }
        function loadSavedUsers() {
            const savedUsers = localStorage.getItem("users");
            if (savedUsers) {
                displayUsers(JSON.parse(savedUsers));
                status.textContent = "Users Loaded from Local Storage.";
            }
            else {
                status.textContent = "Click load users to fetch data.";
            }

        }
        loadBtn.addEventListener("click", fetchUsers);

    </script>
</body>

</html>
